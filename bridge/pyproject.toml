[project]
name = "tracky-bridge"
version = "0.1.0"
description = "Puente local entre Tracky y Whisper (solo 127.0.0.1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.26",
  "tomli>=2.0; python_version < '3.11'",
  # Distinguir voces ("Participante N") con un modelo ONNX local (ADR-0010).
  "sherpa-onnx>=1.12",
  # Motor por defecto en Mac con Apple Silicon (GPU/Metal).
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
faster = ["faster-whisper>=1.0"]
openai = ["openai-whisper>=20240930"]

[project.scripts]
tracky-bridge = "tracky_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracky_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
