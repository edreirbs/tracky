<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foco Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: pizarra de juntas (máx. 1180px). Arriba captura; en "Ahora" un tablero de 2 zonas:
   Ahora (3 post-its grandes) | Siguientes + Esperando (post-its chicos). Hojas de papel para listas y formularios.
   Mundo visual: pizarra de grafito mate, post-its en tonos sobrios; el color de cada post-it = la persona. */
:root{
  color-scheme:dark;
  --board:#2C3230; --board-2:#353C39; --frame:#1F2423;
  --chalk:#ECEEE9; --chalk-dim:#A3AAA5; --chalk-line:#46504C;
  --paper:#F7F6F1; --paper-ink:#20252A; --paper-muted:#69706C; --paper-line:#E1DFD6; --paper-2:#EEECE4;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-deep:#2147A8; --accent-soft:#E2E9FB;
  --hi:#F2D45C; --hi-ink:#20252A;
  --good:#2E8A5E; --good-ink:#FFFFFF; --good-soft:#DCEFE3; --warn:#C2482F; --warn-soft:#F7E0D9;
  --n0:#F3E3A1; --n1:#F1D0C8; --n2:#CFE2D0; --n3:#C9DBEA; --n4:#DDD4EB; --n5:#F2D9B3; --n-none:#E9E8E1;
  --p0:#C9A82A; --p1:#C9705E; --p2:#4F9A68; --p3:#4C80B5; --p4:#8A70B8; --p5:#C98A3A;
  --line:#B9BDB8;
  --fg:var(--chalk); --mut:var(--chalk-dim); --ln:var(--chalk-line); --sf2:var(--board-2); --inv:var(--board);
  --f-ui:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-marker:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --pin-shadow:0 1px 1px rgba(0,0,0,.25), 0 12px 20px -12px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{background:var(--board);color:var(--chalk)}
body{font-family:var(--f-ui);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 20% -10%,rgba(255,255,255,.05),transparent 70%),radial-gradient(900px 600px at 110% 120%,rgba(0,0,0,.25),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 90px}

/* Superficies de papel: redefinen los tokens de texto */
.list,.box,.step,.proc,.pcard,.banner,.lock-card,.capture,.toast,.wait-box{--fg:var(--paper-ink);--mut:var(--paper-muted);--ln:var(--paper-line);--sf2:var(--paper-2);--inv:var(--paper);color:var(--paper-ink)}
.slot,.mini{--fg:var(--paper-ink);--mut:rgba(32,37,42,.62);--ln:rgba(32,37,42,.16);--sf2:rgba(255,255,255,.55);--inv:var(--paper);color:var(--paper-ink)}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--f-marker);font-weight:700;font-size:2.1rem;line-height:1;margin:0;color:var(--chalk);letter-spacing:.01em}
.brand h1 span{background:var(--n0);color:var(--paper-ink);padding:0 10px 2px;display:inline-block;transform:rotate(-2deg);box-shadow:var(--pin-shadow);margin-right:4px}
.today{color:var(--chalk-dim);font-size:.92rem;font-weight:600;text-transform:capitalize}
.top-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.streak{font-weight:700;font-size:.85rem;color:var(--chalk);border:1px solid var(--chalk-line);padding:5px 12px;border-radius:999px;white-space:nowrap}

/* Captura: tira de papel */
.capture{margin-top:18px;background:var(--paper);border-radius:6px;padding:6px 6px 6px 18px;display:flex;gap:8px;align-items:center;box-shadow:var(--pin-shadow)}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:1.08rem;padding:11px 0;outline:none;font-weight:600;color:var(--paper-ink)}
.capture input::placeholder{color:var(--paper-muted);font-weight:500}
.capture-hint{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:26px;margin-top:9px;font-size:.85rem;color:var(--chalk-dim)}
.capture-hint kbd{font-family:var(--f-ui);font-size:.75rem;border:1px solid var(--chalk-line);border-radius:5px;padding:0 6px;color:var(--chalk)}
.sens{color:#FFD3C7;background:rgba(194,72,47,.35);padding:2px 10px;border-radius:999px;font-weight:700}

/* Pestañas: etiquetas de marcador */
.tabs-scroll{overflow-x:auto;margin-top:14px;scrollbar-width:none;border-bottom:1px solid var(--chalk-line)}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:4px;min-width:max-content}
.tab{border:0;background:transparent;padding:10px 14px 12px;font-weight:700;font-size:.92rem;color:var(--chalk-dim);cursor:pointer;display:flex;gap:8px;align-items:center;position:relative}
.tab:hover{color:var(--chalk)}
.tab[aria-selected="true"]{color:var(--chalk)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;background:var(--hi)}
.badge{font-size:.72rem;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;background:var(--chalk);color:var(--board)}
.badge.alert{background:var(--warn);color:#fff}

/* Botones */
.btn{border:1px solid var(--ln);background:transparent;color:var(--fg);border-radius:8px;padding:8px 14px;font-weight:700;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2;transition:background .12s ease,border-color .12s ease}
.btn:hover{background:var(--sf2);border-color:var(--mut)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.btn.good:hover{background:#25744F}
.btn.ghost{border-color:transparent}
.btn.small{padding:6px 11px;font-size:.85rem}
.btn.tiny{padding:4px 9px;font-size:.8rem;border-radius:6px}
.btn.big{padding:13px 20px;font-size:1rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--warn)}
.top .btn{color:var(--chalk);border-color:var(--chalk-line)}

/* Chips y etiquetas */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:transparent;border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:700;font-size:.88rem;display:inline-flex;gap:7px;align-items:center;color:var(--fg)}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.slot .chip{background:rgba(255,255,255,.5)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sf2);color:var(--mut);white-space:nowrap}
.tag.due-today{background:var(--hi);color:var(--hi-ink)}
.tag.due-late{background:var(--warn);color:#fff}
.tag.block{background:var(--accent-soft);color:var(--accent)}
.tag.person{background:transparent;color:var(--fg);padding-left:0}
.slot .tag.person .dot,.mini .tag.person .dot{display:none}
.slot .tag.person,.mini .tag.person{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}

/* Títulos */
main{margin-top:24px;display:flex;flex-direction:column;gap:22px}
.h2{font-family:var(--f-marker);font-weight:700;font-size:clamp(2.2rem,4.6vw,2.8rem);margin:0;line-height:1;color:var(--chalk)}
.mark{background:none;color:inherit;padding:0}
.sub{color:var(--chalk-dim);margin:6px 0 0;max-width:62ch}
.h3{font-weight:800;font-size:1.05rem;margin:0;color:var(--fg)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.section-head .h3{color:var(--chalk)}
.marker{font-family:var(--f-marker);font-weight:700;font-size:2.2rem;line-height:1;margin:0;color:var(--chalk)}
.marker.sm{font-size:1.65rem}

/* Avisos: tiras de papel */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 14px 11px 16px;border-radius:6px;background:var(--paper);box-shadow:var(--pin-shadow);border-left:5px solid var(--paper-muted)}
.banner p{margin:0;flex:1;min-width:200px;font-size:.93rem}
.banner.follow{border-left-color:var(--warn)}
.banner.ex{border-left-color:var(--accent)}
.banner strong{font-weight:800}
.banners{display:flex;flex-direction:column;gap:10px}

/* Tablero */
.board{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--chalk-line);padding-bottom:6px}
.col-c{font-weight:700;font-size:.85rem;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.col-side{gap:26px}
.col-side > section{display:flex;flex-direction:column;gap:12px}

/* Post-its grandes */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-top:4px}
@media (max-width:760px){.slots{grid-template-columns:1fr}}
.slot{--note:var(--n-none);background:var(--note);border-radius:2px;padding:22px 16px 16px;display:flex;flex-direction:column;gap:11px;min-width:0;position:relative;box-shadow:var(--pin-shadow);min-height:250px;
  background-image:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%,transparent 82%,rgba(0,0,0,.05))}
.slots > :nth-child(1){transform:rotate(-.7deg)}
.slots > :nth-child(2){transform:rotate(.5deg)}
.slots > :nth-child(3){transform:rotate(-.3deg)}
.slot::before,.mini::before{content:"";position:absolute;top:7px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8E9590,#4C5350);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.slot .num{font-weight:800;font-size:.72rem;letter-spacing:.1em;color:var(--mut)}
.slot .act{font-weight:800;font-size:1.18rem;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.slot .orig{color:var(--mut);font-size:.84rem;margin-top:-5px;overflow-wrap:anywhere}
.slot .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slot .tag.block{background:rgba(255,255,255,.7)}
.slot .muted{color:var(--mut)}
.slot.empty{background:transparent;background-image:none;border:1.5px dashed var(--chalk-line);box-shadow:none;transform:none!important;color:var(--chalk-dim);--fg:var(--chalk);--ln:var(--chalk-line);--sf2:var(--board-2);justify-content:center;align-items:flex-start}
.slot.empty::before{display:none}
.slot.empty .num{color:var(--chalk-dim)}
.slot.running{transform:none!important;outline:3px solid var(--hi);outline-offset:4px}
.slot-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.est-label{font-size:.78rem;font-weight:700;color:var(--mut)}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* Temporizador */
.timer{display:flex;flex-direction:column;gap:7px}
.bar{height:10px;border-radius:999px;background:rgba(32,37,42,.12);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--paper-ink);transition:width 1s linear}
.bar.over i{background:var(--warn)}
.timer-txt{font-variant-numeric:tabular-nums;font-size:.85rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.timer-txt b{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}

/* Post-its chicos */
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:980px){.minis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.mini{--note:var(--n-none);background:var(--note);border-radius:2px;padding:18px 12px 11px;display:flex;flex-direction:column;gap:7px;position:relative;box-shadow:var(--pin-shadow);min-width:0}
.minis > :nth-child(odd){transform:rotate(-.6deg)}
.minis > :nth-child(even){transform:rotate(.5deg)}
.mini::before{top:6px;width:8px;height:8px;margin-left:-4px}
.mini-t{font-weight:800;font-size:.9rem;line-height:1.3;overflow-wrap:anywhere}
.mini-s{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mini-s .tag{font-size:.7rem;padding:1px 7px}
.mini-a{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.col-empty{color:var(--chalk-dim);font-size:.88rem;margin:0;padding:12px;border:1.5px dashed var(--chalk-line);border-radius:4px}

/* Hecho hoy */
.done-strip{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--chalk-line);padding-top:16px}
.wins{display:flex;gap:8px;flex-wrap:wrap}
.win{background:var(--n2);color:var(--paper-ink);border-radius:2px;padding:4px 11px;font-weight:700;font-size:.82rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 1px rgba(0,0,0,.25);text-decoration:line-through;text-decoration-color:rgba(32,37,42,.45)}
.win-count{font-family:var(--f-marker);font-weight:700;font-size:2.3rem;line-height:1;color:var(--hi)}

/* Listas: hojas de papel */
.list{display:flex;flex-direction:column;background:var(--paper);border-radius:4px;overflow:hidden;box-shadow:var(--pin-shadow)}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--paper-line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .txt{flex:1;min-width:180px;overflow-wrap:anywhere}
.li .txt .t{font-weight:700}
.li .txt .s{font-size:.82rem;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.li.done .t{text-decoration:line-through;color:var(--mut)}
.empty-msg{padding:20px;color:var(--mut)}

/* Procesar */
.proc{background:var(--paper);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--pin-shadow)}
.proc-text{font-weight:800;font-size:1.3rem;line-height:1.3;overflow-wrap:anywhere;background:var(--n0);padding:16px 18px;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.2), 0 8px 14px -10px rgba(0,0,0,.5);transform:rotate(-.6deg);display:inline-block;margin-top:6px;max-width:100%}
.q{display:flex;flex-direction:column;gap:8px}
.q label,.q .ql{font-weight:800}
.q .help{font-size:.82rem;color:var(--mut)}
.field{border:1px solid var(--ln);background:#FFFFFF;color:var(--paper-ink);border-radius:8px;padding:10px 12px;width:100%;font-size:.98rem}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.field{color-scheme:light}
.progress{font-weight:700;font-size:.85rem;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.divider{height:1px;background:var(--paper-line)}
.wait-box{background:var(--paper-2);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Personas */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{background:var(--paper);border:0;border-top:6px solid var(--pc,var(--n-none));border-radius:3px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--pin-shadow)}
.pcard:hover{transform:translateY(-2px)}
.pcard[aria-pressed="true"]{outline:3px solid var(--hi);outline-offset:3px}
.pcard .pn{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.counts{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--mut)}
.counts b{color:var(--fg);font-variant-numeric:tabular-nums}
form.row .field{background:var(--paper)}

/* Cierre */
.steps{display:flex;flex-direction:column;gap:16px}
.step{background:var(--paper);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--pin-shadow)}
.step-h{display:flex;gap:12px;align-items:center}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--paper-ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.star{border:1px solid var(--paper-line);background:#fff;border-radius:6px;width:38px;height:38px;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;flex:none;color:var(--paper-muted)}
.star[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.insight{background:var(--n0);color:var(--paper-ink);border-radius:2px;padding:14px 16px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.insight .big{font-family:var(--f-marker);font-size:2.2rem;font-weight:700;display:block;line-height:1}
.step .win-count{color:var(--good)}

/* Seguridad */
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.cards2{grid-template-columns:1fr}}
.box{background:var(--paper);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--pin-shadow)}
.box p{margin:0}
.muted{color:var(--mut)}
.small{font-size:.86rem}
textarea.field{min-height:90px;font-size:.8rem}
.ok-line{color:var(--good);font-weight:700}
.err-line{color:var(--warn);font-weight:700}

/* Entrada / bloqueo */
.lock{position:fixed;inset:0;background:var(--board);z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lock-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;text-align:center;background:var(--paper);padding:30px 26px 26px;border-radius:4px;box-shadow:var(--pin-shadow);position:relative}
.lock-card::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8E9590,#4C5350)}
.lock-card h2{font-family:var(--f-marker);font-weight:700;font-size:2.4rem;margin:6px 0 0;line-height:1}
.lock-card form{display:flex;flex-direction:column;gap:10px;text-align:left}
.lock-card .lk-mark{background:var(--n0);padding:0 8px;display:inline-block;transform:rotate(-2deg)}
.lock-card .lk-note{font-size:.85rem;color:var(--paper-muted)}
.lock-card .lk-err{color:var(--warn);font-weight:700;background:var(--warn-soft);padding:8px 12px;border-radius:6px;margin:0}
.lock-card .lk-steps{text-align:left;margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.lock-card .muted{color:var(--paper-muted)}
.save-st{font-size:.82rem;color:var(--chalk-dim);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.save-st::before{content:"";width:7px;height:7px;border-radius:50%;background:#6FCF97}
.save-st.saving::before{background:var(--hi)}
.save-st.error{color:#FFB4A3}
.save-st.error::before{background:var(--warn)}

/* Toast y confeti */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--paper);padding:11px 18px;border-radius:6px;font-weight:700;opacity:0;pointer-events:none;transition:.22s ease;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--pin-shadow);border-left:5px solid var(--good)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:10px;height:10px;border-radius:1px;pointer-events:none;z-index:70;animation:pop .9s cubic-bezier(.2,.7,.4,1) forwards;box-shadow:0 1px 1px rgba(0,0,0,.3)}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.bar i,.btn,.toast{transition:none}}
/* Archivo: fichas */
.ficha{--fg:var(--paper-ink);--mut:var(--paper-muted);--ln:var(--paper-line);--sf2:var(--paper-2);--inv:var(--paper);color:var(--paper-ink)}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.ficha{background:var(--paper);border-top:5px solid var(--pc,var(--n-none));border-radius:3px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--pin-shadow);min-width:0;
  background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(47,91,211,.06) 25px 26px);background-position:0 54px}
.box .ficha{box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ficha-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ficha-t{font-weight:800;font-size:1.08rem;line-height:1.25;overflow-wrap:anywhere}
.ficha-sub{font-size:.86rem;color:var(--mut);overflow-wrap:anywhere}
.ficha-sub b{color:var(--fg)}
.ficha-b{font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.ficha-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;padding-top:8px;border-top:1px solid var(--paper-line)}
.ficha .more{color:var(--accent);padding:0}
.kv{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:5px 6px 5px 10px}
.kv .k{font-size:.68rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;width:40px;flex:none}
.kv .btn{flex:none}
.kv .v{flex:1;min-width:0;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:all}
.pinbtn{border:0;background:transparent;font-size:1.05rem;cursor:pointer;color:var(--mut);padding:0 2px;line-height:1}
.pinbtn[aria-pressed="true"]{color:#B8901A}
.tagbtn{border:0;cursor:pointer;font-family:inherit}
.tagbtn:hover{background:var(--accent-soft);color:var(--accent)}
.searchbar{background:var(--paper);border-radius:6px;padding:4px 6px 4px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--pin-shadow)}
.searchbar::before{content:"Buscar";font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted)}
.search-in{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;padding:11px 0;outline:none;font-weight:600;color:var(--paper-ink)}
.board-chips{margin-top:-6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.grid2 > div{display:flex;flex-direction:column;gap:4px;min-width:0}
textarea.note-area{min-height:130px;font-family:var(--f-ui);font-size:.95rem}
.more{background:none;border:0;color:var(--chalk-dim);font-weight:700;cursor:pointer;padding:4px 0;text-align:left;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.list .more{color:var(--accent);padding:12px 16px}

<body>
<div id="lock" class="lock">
  <div class="lock-card">
    <h2><span class="lk-mark">Foco</span> Diario</h2>
    <div id="lockBody" style="display:flex;flex-direction:column;gap:14px"><p class="muted">Cargando…</p></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="top">
      <div class="brand"><h1><span>Foco</span> Diario</h1><span class="today" id="todayLbl"></span></div>
      <div class="top-actions">
        <span class="streak" id="winPill"></span><span class="save-st" id="saveStatus">Guardado</span><button class="btn small" id="lockBtn" data-act="lock">Bloquear</button>
      </div>
    </div>
    <form class="capture" id="capForm" autocomplete="off">
      <input id="capIn" maxlength="200" placeholder="Saca de tu cabeza… Ej: Laura: reservar sala jueves" aria-label="Capturar pendiente">
      <button class="btn primary" type="submit">Capturar</button>
    </form>
    <div class="capture-hint" id="capHint"></div>
    <div class="tabs-scroll"><nav class="tabs" role="tablist" id="tabs"></nav></div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const KEY = 'foco-diario-v1';
const MAX_NOW = 3;
const PCOLORS = ['--p0','--p1','--p2','--p3','--p4','--p5'];
const DAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const friday = () => { const d = new Date(); let add = (5 - d.getDay() + 7) % 7; if (add === 0 && d.getHours() >= 15) add = 7; if (d.getDay()===6) add=6; d.setDate(d.getDate()+add); return iso(d); };
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
function fmtDay(s){
  if (!s) return '';
  const t = today();
  if (s === t) return 'hoy';
  if (s === addDays(1)) return 'mañana';
  if (s === addDays(-1)) return 'ayer';
  const d = parseISO(s);
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
const mins = ms => Math.max(0, Math.round(ms/60000));
const clock = ms => { const s = Math.max(0, Math.floor(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

/* ---------- Estado: archivo cifrado en tu carpeta ---------- */
const DATA = 'datos.focodata';
const ITER = 600000;
let S = null, KEYC = null, SALT = null, dirH = null;
let saveT = null, saveState = 'ok', lastSavedAt = null, bkDay = null;
let writing = Promise.resolve();
function setSave(st){
  saveState = st;
  const el = document.getElementById('saveStatus'); if (!el) return;
  el.className = 'save-st ' + (st==='ok'?'':st);
  el.textContent = st==='saving' ? 'Guardando…' : st==='error' ? 'No se pudo guardar' : 'Guardado y cifrado';
  if (st==='error' && view==='ahora' && S) render();
}
function save(){ if (!S) return; clearTimeout(saveT); setSave('saving'); saveT = setTimeout(()=>{ saveT=null; flush(); }, 500); }
function flush(){
  writing = writing.then(async () => {
    if (!S || !KEYC || !dirH) return;
    try {
      const txt = await encryptWith(KEYC, SALT, S);
      await writeFile(dirH, DATA, txt);
      lastSavedAt = Date.now();
      try { await dailyBackup(txt); } catch(e){}
      setSave('ok');
    } catch(e){ setSave('error'); }
  });
  return writing;
}
async function writeFile(dir, name, txt){
  const fh = await dir.getFileHandle(name, {create:true});
  const w = await fh.createWritable(); await w.write(txt); await w.close();
}
async function dailyBackup(txt){
  if (bkDay === today()) return;
  const d = await dirH.getDirectoryHandle('respaldos', {create:true});
  await writeFile(d, `respaldo-${today()}.focodata`, txt);
  bkDay = today();
  const names = [];
  for await (const [n,h] of d.entries()) if (h.kind==='file' && /^respaldo-\d{4}-\d{2}-\d{2}\.focodata$/.test(n)) names.push(n);
  names.sort().reverse().slice(14).forEach(n => d.removeEntry(n).catch(()=>{}));
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden' && saveT){ clearTimeout(saveT); saveT=null; flush(); } });
window.addEventListener('beforeunload', e => { if (saveT || saveState==='saving'){ e.preventDefault(); e.returnValue=''; } });

function examples(){
  const t = today(), now = Date.now();
  const p = [
    {id:'exL', name:'Laura', color:0, ex:true},
    {id:'exC', name:'Carlos', color:1, ex:true},
    {id:'exS', name:'Sofía', color:2, ex:true},
  ];
  const it = (o) => Object.assign({id:uid(), text:'', action:'', personId:null, status:'inbox', due:null, blocking:false, createdAt:now, ex:true}, o);
  return { v:1, people:p, items:[
    it({text:'sala junta jueves', action:'Confirmar sala para la junta del jueves', personId:'exL', status:'now', due:t, blocking:true}),
    it({text:'viáticos', action:'Mandar reporte de viáticos de octubre', personId:'exC', status:'now', due:t}),
    it({text:'contratos', action:'Imprimir contratos para firma', personId:'exS', status:'next', due:addDays(1)}),
    it({text:'comida proveedor', action:'Agendar comida con proveedor nuevo', personId:'exL', status:'next', due:friday()}),
    it({text:'Laura: cambiar vuelo del lunes', personId:'exL', status:'inbox'}),
    it({text:'pedir tóner para la impresora', status:'inbox'}),
    it({text:'factura octubre', action:'Factura de octubre del proveedor', personId:'exC', status:'waiting', followUp:t, waitingOn:'Proveedor'}),
    it({text:'correo agenda', action:'Responder correo de agenda semanal', personId:'exL', status:'done', doneAt:now-3600e3, estimate:10, actual:18}),
  ], notes:[
    {id:uid(), type:'contact', title:'Lic. Andrea Ruiz (ejemplo)', company:'Socia de Laura en Grupo Norte', phone:'55 1234 5678', email:'andrea.ruiz@ejemplo.com', personId:'exL', body:'Prefiere WhatsApp. Su asistente es Paty.', tags:['socios'], pinned:true, ex:true, createdAt:now, updatedAt:now},
    {id:uid(), type:'contact', title:'Ing. Roberto Salas (ejemplo)', company:'Socio de Carlos, despacho contable', phone:'55 8765 4321', email:'', personId:'exC', body:'Llamar antes de las 2 pm.', tags:['socios','contabilidad'], ex:true, createdAt:now, updatedAt:now-1000},
    {id:uid(), type:'note', title:'Cómo pedir viáticos (ejemplo)', body:'1. Llenar el formato en la intranet.\n2. Adjuntar facturas en PDF.\n3. Mandar a Carlos para firma antes del día 25.', personId:'exC', tags:['procesos'], ex:true, createdAt:now, updatedAt:now-2000},
  ], settings:{autoLock:10, lastBackup:null}, timer:null, lastOpen:t, closedOn:null };
}
function normalize(){
  S.settings = Object.assign({autoLock:10, lastBackup:null}, S.settings||{});
  delete S.settings.pinHash; delete S.settings.pinSalt;
  S.people = S.people || []; S.items = S.items || []; S.notes = S.notes || [];
}
// Rutina de la mañana: lo marcado con estrella pasa a "Ahora"
function morning(){
  const t = today();
  if (S.lastOpen && S.lastOpen !== t){
    let room = MAX_NOW - S.items.filter(i => i.status==='now').length;
    S.items.filter(i => i.tomorrow && i.status!=='done').forEach(i => {
      if (room > 0 && i.status !== 'now'){ i.status = 'now'; room--; }
      i.tomorrow = false;
    });
  }
  const changed = S.lastOpen !== t;
  S.lastOpen = t;
  return changed;
}

/* ---------- Consultas ---------- */
const person = id => S.people.find(p => p.id === id);
const byStatus = st => S.items.filter(i => i.status === st);
const label = i => i.action || i.text;
function score(i){
  let s = 0; const t = today();
  if (i.due && i.due < t) s += 5; else if (i.due === t) s += 3; else if (i.due === addDays(1)) s += 1;
  if (i.blocking) s += 2;
  return s;
}
const nextSorted = () => byStatus('next').sort((a,b) => score(b)-score(a) || (a.due||'9').localeCompare(b.due||'9') || a.createdAt-b.createdAt);
const followToday = () => byStatus('waiting').filter(i => !i.followUp || i.followUp <= today());
const doneToday = () => S.items.filter(i => i.status==='done' && i.doneAt && iso(new Date(i.doneAt)) === today()).sort((a,b)=>b.doneAt-a.doneAt);
const hasEx = () => S.items.some(i=>i.ex) || S.people.some(p=>p.ex) || S.notes.some(n=>n.ex);

/* ---------- Fragmentos de UI ---------- */
function pTag(id){
  const p = person(id);
  if (!p) return `<span class="tag person"><span class="dot" style="background:var(--line)"></span>Sin persona</span>`;
  return `<span class="tag person"><span class="dot" style="background:var(${PCOLORS[p.color%6]})"></span>${esc(p.name)}</span>`;
}
function dueTag(i){
  if (!i.due) return '';
  const t = today();
  if (i.due < t) return `<span class="tag due-late">Venció ${esc(fmtDay(i.due))}</span>`;
  if (i.due === t) return `<span class="tag due-today">Para hoy</span>`;
  return `<span class="tag">Para ${esc(fmtDay(i.due))}</span>`;
}
const blockTag = i => i.blocking ? `<span class="tag block">Alguien te espera</span>` : '';

/* ---------- Vistas ---------- */
let view = 'ahora';
const TABS = [
  ['ahora','Tablero'], ['procesar','Procesar'], ['esperando','Esperando de…'], ['personas','Personas'], ['archivo','Archivo'], ['cierre','Cerrar el día'], ['seguridad','Seguridad']
];
let showAllNext = false;
let selPerson = null;
let proc = null;   // borrador mientras procesas
let ui = {};       // pequeños estados de interfaz

function renderTabs(){
  const nw = doneToday().length;
  $('#winPill').textContent = nw ? `${nw} ${nw===1?'hecha':'hechas'} hoy` : 'Día en blanco, a empezar';
  const nIn = byStatus('inbox').length, nF = followToday().length;
  $('#tabs').innerHTML = TABS.map(([k,l]) => {
    let b = '';
    if (k==='procesar' && nIn) b = `<span class="badge">${nIn}</span>`;
    if (k==='esperando' && nF) b = `<span class="badge alert">${nF}</span>`;
    return `<button class="tab" role="tab" aria-selected="${view===k}" data-act="tab" data-v="${k}">${l}${b}</button>`;
  }).join('');
  
}

const noteVar = pid => { const p = person(pid); return p ? `var(--n${p.color%6})` : 'var(--n-none)'; };
function mini(i, kind){
  const acts = kind==='wait'
    ? `<button class="btn tiny" data-act="wDone" data-id="${i.id}">Ya llegó</button><button class="btn tiny ghost" data-act="wBump" data-id="${i.id}">+2 días</button>`
    : `<button class="btn tiny" data-act="toNow" data-id="${i.id}" ${byStatus('now').length>=MAX_NOW?'disabled title="Ahora está lleno"':''}>A Ahora</button><button class="btn tiny ghost" data-act="done" data-id="${i.id}">Hecho</button>`;
  const extra = kind==='wait'
    ? `<span class="tag ${(!i.followUp||i.followUp<=today())?'due-late':''}">${(!i.followUp||i.followUp<=today())?'Preguntar hoy':'Preguntar '+esc(fmtDay(i.followUp))}</span>`
    : dueTag(i)+blockTag(i);
  return `<div class="mini" style="--note:${noteVar(i.personId)}"><div class="mini-s">${pTag(i.personId)}</div><div class="mini-t">${esc(label(i))}</div><div class="mini-s">${extra}</div><div class="mini-a">${acts}</div></div>`;
}
function vAhora(){
  const now = byStatus('now'), next = nextSorted(), fol = followToday(), inbox = byStatus('inbox'), wins = doneToday();
  const wait = byStatus('waiting').sort((a,b)=>(a.followUp||'').localeCompare(b.followUp||''));
  let b = '';
  if (hasEx()) b += `<div class="banner ex"><p><strong>Estás viendo ejemplos.</strong> Así se ve un día con pendientes. Cuando quieras, bórralos y empieza con los tuyos.</p><button class="btn primary small" data-act="clearEx">Borrar ejemplos y empezar</button></div>`;
  if (saveState==='error') b += `<div class="banner follow"><p><strong>No se pudo guardar en tu carpeta.</strong> Revisa que la carpeta Foco Diario siga en su lugar. Bloquea y vuelve a abrir para reintentar.</p><button class="btn small" data-act="retrySave">Reintentar</button></div>`;
  if (fol.length) b += `<div class="banner follow"><p><strong>Hoy toca dar seguimiento:</strong> ${fol.slice(0,3).map(i=>esc(label(i))).join(' · ')}${fol.length>3?` y ${fol.length-3} más`:''}</p><button class="btn small" data-act="tab" data-v="esperando">Ver seguimientos</button></div>`;
  if (inbox.length) b += `<div class="banner"><p><strong>${inbox.length} ${inbox.length===1?'cosa capturada':'cosas capturadas'}</strong> sin decidir todavía. Procesar toma un par de minutos.</p><button class="btn hi small" data-act="tab" data-v="procesar">Procesar ahora</button></div>`;
  let h = b ? `<div class="banners">${b}</div>` : '';

  h += `<div class="board"><section class="col col-now"><header class="col-h"><h2 class="marker">Ahora</h2><span class="col-c">${now.length} de ${MAX_NOW} · lo demás puede esperar</span></header><div class="slots">`;
  for (let k=0;k<MAX_NOW;k++){
    const i = now[k];
    if (!i){
      h += `<div class="slot empty"><span class="num">0${k+1}</span><p style="margin:0">Espacio libre.</p>${next.length?`<button class="btn small" data-act="pullNext">Traer la más urgente</button>`:`<span class="small">Captura algo arriba o procesa tu bandeja.</span>`}</div>`;
      continue;
    }
    const running = S.timer && S.timer.id === i.id;
    h += `<article class="slot ${running?'running':''}" style="--note:${noteVar(i.personId)}">
      <div class="row" style="justify-content:space-between"><span class="num">0${k+1}</span>${pTag(i.personId)}</div>
      <div class="act">${esc(label(i))}</div>
      ${i.action && i.text && i.text!==i.action ? `<div class="orig">Nota: ${esc(i.text)}</div>`:''}
      <div class="meta">${dueTag(i)}${blockTag(i)}</div>
      <div class="slot-foot">${running ? timerBlock(i) : `
        <span class="est-label">¿Cuánto crees que tardas? Toca para empezar</span>
        <div class="row">${[5,15,25,45].map(m=>`<button class="chip" data-act="start" data-id="${i.id}" data-m="${m}">${m} min</button>`).join('')}</div>
        <div class="row"><button class="btn good small" data-act="done" data-id="${i.id}">Terminé</button><button class="btn ghost small" data-act="toNext" data-id="${i.id}">Sacar</button></div>`}
      </div></article>`;
  }
  h += `</div></section><aside class="col col-side">`;
  const shown = showAllNext ? next : next.slice(0,4);
  h += `<section><header class="col-h"><h3 class="marker sm">Siguientes</h3><span class="col-c">${next.length}</span></header>`;
  h += next.length ? `<div class="minis">${shown.map(i=>mini(i,'next')).join('')}</div>${next.length>4?`<button class="more" data-act="moreNext">${showAllNext?'Ver menos':`Ver las ${next.length}`}</button>`:''}` : `<p class="col-empty">Nada en fila. Lo que proceses aparece aquí, ordenado por urgencia.</p>`;
  h += `</section><section><header class="col-h"><h3 class="marker sm">Esperando de…</h3><span class="col-c">${wait.length}</span></header>`;
  h += wait.length ? `<div class="minis">${wait.slice(0,4).map(i=>mini(i,'wait')).join('')}</div>${wait.length>4?`<button class="more" data-act="tab" data-v="esperando">Ver las ${wait.length}</button>`:''}` : `<p class="col-empty">No esperas nada de nadie.</p>`;
  h += `</section></aside></div>`;
  h += `<section class="done-strip"><div class="row" style="justify-content:space-between;align-items:baseline"><h3 class="marker sm">Hecho hoy</h3><span class="win-count">${wins.length}</span></div>
    <div class="wins">${wins.length ? wins.slice(0,10).map(i=>`<span class="win">${esc(label(i))}</span>`).join('') : `<span class="small" style="color:var(--chalk-dim)">Lo que termines se pega aquí.</span>`}</div></section>`;
  return h;
}

function timerBlock(i){
  return `<div class="timer" data-timer="${i.id}">
    <div class="bar" id="bar-${i.id}"><i style="width:0%"></i></div>
    <div class="timer-txt"><span><b id="clk-${i.id}">0:00</b> <span class="muted">de ${S.timer.est} min</span></span><span class="muted" id="msg-${i.id}"></span></div>
    <div class="row">
      <button class="btn good small" data-act="done" data-id="${i.id}">Terminé</button>
      <button class="btn small" data-act="pause" data-id="${i.id}" id="pz-${i.id}">${S.timer.startedAt?'Pausar':'Seguir'}</button>
      <button class="btn small ghost" data-act="stopTimer">Cancelar tiempo</button>
    </div></div>`;
}

function vProcesar(){
  const inbox = byStatus('inbox');
  if (!inbox.length){ proc = null; return `<section><h2 class="h2"><span class="mark">Bandeja vacía</span></h2><p class="sub">Todo tiene su lugar. Cuando captures algo arriba, aquí decides qué es y de quién.</p></section>
    <div class="row"><button class="btn primary" data-act="tab" data-v="ahora">Ir a Ahora</button></div>`; }
  if (!proc || !inbox.find(i=>i.id===proc.id)){
    const i = inbox[0];
    const guess = guessPerson(i.text);
    proc = {id:i.id, personId:i.personId || guess.id || null, action:i.action || guess.rest || i.text, due:i.due||null, blocking:!!i.blocking, waiting:false, waitingOn:'', follow:addDays(2), newP:false};
  }
  const i = S.items.find(x=>x.id===proc.id);
  const pos = inbox.indexOf(i)+1;
  const dueOpts = [['Hoy',today()],['Mañana',addDays(1)],['Esta semana',friday()],['Sin fecha',null]];
  return `<section><div class="section-head"><div><h2 class="h2"><span class="mark">Procesar</span></h2><p class="sub">Una a la vez. Tres preguntas y listo.</p></div><span class="progress">${pos} de ${inbox.length}</span></div></section>
  <div class="proc">
    <div><div class="small muted">Capturaste:</div><div class="proc-text">${esc(i.text)}</div></div>
    <div class="q"><span class="ql">1. ¿De quién es?</span>
      <div class="chips">${S.people.map(p=>`<button class="chip" aria-pressed="${proc.personId===p.id}" data-act="pPick" data-id="${p.id}"><span class="dot" style="background:var(${PCOLORS[p.color%6]})"></span>${esc(p.name)}</button>`).join('')}
      <button class="chip" aria-pressed="${proc.personId==='me'}" data-act="pPick" data-id="me">Mío</button>
      <button class="chip" data-act="pNew">+ Persona nueva</button></div>

  if (!w.length) return h + `<div class="list"><p class="empty-msg">No esperas nada de nadie. Cuando delegues algo, al procesarlo elige "Espero a alguien".</p></div>`;
  const t = today();
  h += `<div class="list">` + w.map(i => {

    return `<div class="li"><div class="txt"><div class="t">${esc(label(i))}</div>

function estInsight(){
  const d = S.items.filter(i=>i.status==='done' && i.estimate && i.actual);
  if (d.length < 3) return `<div class="box"><p class="muted">Cuando termines 3 tareas usando el temporizador, aquí verás cuánto tardas de verdad comparado con lo que calculas.</p><p class="small muted">Llevas ${d.length} de 3.</p></div>`;
  const r = d.reduce((s,i)=>s+i.actual,0) / d.reduce((s,i)=>s+i.estimate,0);
  const f = r.toFixed(1).replace('.0','');
  let msg = r > 1.15 ? `Tus tareas toman ${f} veces lo que calculas. Mañana, cuando pienses "15 min", aparta ${Math.round(15*r)}.` :
            r < 0.85 ? `Terminas más rápido de lo que calculas (${f}×). Puedes darte estimados más cortos.` :
            `Tus estimados son muy precisos. Bien calibrada.`;
  return `<div class="insight"><span class="big">${f}×</span>${msg}<div class="small" style="font-weight:500;margin-top:6px">Basado en ${d.length} tareas con tiempo medido.</div></div>`;
}

let arQ = '', arFilter = 'all', arEdit = null, arConfirmDel = null, arOpen = {};
const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function noteHay(n){ const p = person(n.personId); return fold([n.title,n.body,n.company,n.phone,(n.phone||'').replace(/\D/g,''),n.email,(n.tags||[]).join(' '),p?p.name:''].join(' ')); }
function matchQ(hay){ const t = fold(arQ).split(/\s+/).filter(Boolean); return t.every(x => hay.includes(x)); }
function allTags(){ const m = {}; S.notes.forEach(n => (n.tags||[]).forEach(t => m[t] = 1)); return Object.keys(m).sort(); }
function notesFiltered(){
  let ns = S.notes.slice();
  if (arFilter==='contact' || arFilter==='note') ns = ns.filter(n => n.type===arFilter);
  else if (arFilter.startsWith('p:')) ns = ns.filter(n => n.personId===arFilter.slice(2));
  else if (arFilter.startsWith('t:')) ns = ns.filter(n => (n.tags||[]).includes(arFilter.slice(2)));
  if (arQ.trim()) ns = ns.filter(n => matchQ(noteHay(n)));
  return ns.sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || (b.updatedAt||0)-(a.updatedAt||0));
}
function ficha(n){
  const p = person(n.personId);
  const pin = `<button class="pinbtn" data-act="arPin" data-id="${n.id}" aria-pressed="${!!n.pinned}" aria-label="Fijar arriba" title="Fijar arriba">${n.pinned?'★':'☆'}</button>`;
  const del = arConfirmDel===n.id
    ? `<span class="small">¿Borrar?</span><button class="btn tiny danger" data-act="arDel" data-id="${n.id}">Sí, borrar</button><button class="btn tiny ghost" data-act="arDelNo">No</button>`
    : `<button class="btn tiny ghost" data-act="arAskDel" data-id="${n.id}">Borrar</button>`;
  const tags = (n.tags||[]).length ? `<div class="mini-s">${n.tags.map(t => `<button class="tag tagbtn" data-act="arFilter" data-v="t:${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : '';
  const acts = `<div class="ficha-a"><button class="btn tiny" data-act="arEdit" data-id="${n.id}">Editar</button>${del}</div>`;
  const style = `style="--pc:${noteVar(n.personId)}"`;
  if (n.type==='contact'){

    return `<article class="ficha" ${style}><div class="ficha-h"><span class="kind">Contacto</span>${pin}</div>
      <div class="ficha-t">${esc(n.title)}</div>
      ${n.company?`<div class="ficha-sub">${esc(n.company)}</div>`:''}
      ${p?`<div class="ficha-sub">Contacto de <b>${esc(p.name)}</b></div>`:''}
      ${line('Tel.', n.phone)}${line('Correo', n.email)}
      ${n.body?`<div class="ficha-b">${esc(n.body)}</div>`:''}${tags}${acts}</article>`;
  }
  const body = n.body || '', long = body.length > 260;
  return `<article class="ficha" ${style}><div class="ficha-h"><span class="kind">Nota${p?' · '+esc(p.name):''}</span>${pin}</div>
    <div class="ficha-t">${esc(n.title)}</div>
    ${body?`<div class="ficha-b">${esc(long && !arOpen[n.id] ? body.slice(0,260)+'…' : body)}</div>`:''}
    ${long?`<button class="more" data-act="arOpen" data-id="${n.id}">${arOpen[n.id]?'Ver menos':'Ver todo'}</button>`:''}${tags}${acts}</article>`;
}

/* ---------- Temporizador ---------- */
function elapsed(){ const t = S.timer; if (!t) return 0; return t.acc + (t.startedAt ? Date.now()-t.startedAt : 0); }
function tick(){
  if (!S) return;
  const t = S.timer; if (!t) return;
  const bar = document.getElementById('bar-'+t.id); if (!bar) return;
  const e = elapsed(), est = t.est*60000;
  const over = e > est;
  bar.classList.toggle('over', over);
  bar.firstElementChild.style.width = Math.min(100, (e/est)*100) + '%';
  document.getElementById('clk-'+t.id).textContent = clock(e);
  const m = document.getElementById('msg-'+t.id);
  if (m) m.textContent = over ? `+${clock(e-est)} extra, está bien` : `quedan ${clock(est-e)}`;
}
setInterval(tick, 1000);

let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2600); }
function celebrate(el){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const cols = ['var(--n0)','var(--n1)','var(--n2)','var(--n3)','var(--n4)','var(--n5)'];
  for (let k=0;k<16;k++){
    const s = document.createElement('span'); s.className = 'confetti';
    const a = Math.random()*Math.PI*2, d = 50+Math.random()*90;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--r:${Math.random()*540-270}deg`;
    document.body.appendChild(s); setTimeout(()=>s.remove(), 1150);
  }
}
const item = id => S.items.find(i=>i.id===id);
function finish(i, el){
  if (S.timer && S.timer.id === i.id){ i.estimate = S.timer.est; i.actual = Math.max(1, mins(elapsed())); S.timer = null; }
  i.status = 'done'; i.doneAt = Date.now(); i.tomorrow = false;
  save(); celebrate(el);
  const n = doneToday().length;
  toast(['Listo.','Una menos.','Bien hecho.','Fuera de tu cabeza.','Buen ritmo.'][n%5] + ` Llevas ${n} hoy.`);
  render();
}
function guessPerson(text){
  const m = /^\s*([^:\-–—]{2,30})\s*[:\-–—]\s*(.+)$/.exec(text);
  if (m){ const p = S.people.find(p => p.name.toLowerCase() === m[1].trim().toLowerCase()); if (p) return {id:p.id, rest:m[2].trim()}; }
  return {id:null, rest:null};
}
function addPerson(name){
  name = name.trim(); if (!name) return null;
  const ex = S.people.find(p=>p.name.toLowerCase()===name.toLowerCase()); if (ex) return ex;
  const used = S.people.map(p=>p.color);
  let c = 0; for (let k=0;k<6;k++){ if (!used.includes(k)){ c=k; break; } c = S.people.length%6; }
  const p = {id:uid(), name, color:c}; S.people.push(p); save(); return p;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  const i = id ? item(id) : null;
  switch(a){
    case 'tab': go(b.dataset.v); break;
    case 'lock': lockNow(); break;
    case 'clearEx':
      S.items = S.items.filter(x=>!x.ex); S.people = S.people.filter(p=>!p.ex); S.notes = S.notes.filter(n=>!n.ex);
      if (S.timer && !item(S.timer.id)) S.timer = null;
      save(); toast('Listo. Ahora es tuyo. Captura tu primer pendiente arriba.'); render(); $('#capIn').focus(); break;
    case 'start':
      S.timer = {id, est:+b.dataset.m, startedAt:Date.now(), acc:0}; save(); render(); break;
    case 'pause':
      if (!S.timer) break;
      if (S.timer.startedAt){ S.timer.acc += Date.now()-S.timer.startedAt; S.timer.startedAt = null; }
      else S.timer.startedAt = Date.now();
      save(); render(); break;
    case 'stopTimer': S.timer = null; save(); render(); break;
    case 'done': if (i) finish(i, b); break;
    case 'toNext': if (i){ if (S.timer && S.timer.id===id) S.timer=null; i.status='next'; save(); render(); } break;
    case 'toNow': if (i && byStatus('now').length < MAX_NOW){ i.status='now'; save(); render(); } break;
    case 'pullNext': { const n = nextSorted()[0]; if (n){ n.status='now'; save(); render(); } break; }
    case 'moreNext': showAllNext = !showAllNext; render(); break;

    // Procesar
    case 'pPick': proc.personId = proc.personId===id ? null : id; render(); break;
    case 'pNew': proc.newP = true; render(); setTimeout(()=>{ const n=$('#npName'); n&&n.focus(); }, 0); break;
    case 'pDue': proc.due = b.dataset.v || null; render(); break;
    case 'pWait': proc.waiting = !proc.waiting; render(); break;
    case 'pFollow': proc.follow = b.dataset.v; render(); break;
    case 'pTwo': case 'pSave': {
      const it = item(proc.id); if (!it) break;
      it.personId = proc.personId==='me' ? null : proc.personId;
      it.action = (proc.action||'').trim() || it.text;
      it.due = proc.due; it.blocking = proc.blocking;
      if (a==='pTwo'){ it.estimate = 2; proc = null; finish(it, b); break; }
      const to = b.dataset.to;
      if (to==='now' && byStatus('now').length>=MAX_NOW) break;
      it.status = to;
      if (to==='waiting'){ it.followUp = proc.follow; it.waitingOn = (proc.waitingOn||'').trim(); }
      proc = null; save();
      toast(to==='next'?'Guardada en Siguientes.':to==='now'?'Lista en Ahora.':'Te aviso cuándo preguntar.');
      render(); break;
    }
    case 'pSkip': {
      const inbox = byStatus('inbox'); const it = item(proc.id);
      if (inbox.length>1 && it){ S.items = S.items.filter(x=>x!==it); S.items.push(it); save(); }
      proc = null; render(); break;
    }
    case 'pDel': S.items = S.items.filter(x=>x.id!==proc.id); proc=null; save(); toast('Borrada.'); render(); break;

    // Esperando
    case 'wDone': if (i){ i.status='done'; i.doneAt=Date.now(); save(); celebrate(b); toast('Cerrado. Una cosa menos en la cabeza.'); render(); } break;
    case 'wBump': if (i){ i.followUp = addDays(2); save(); toast(`Te recuerdo el ${fmtDay(i.followUp)}.`); render(); } break;
    case 'wNext': if (i){ i.status='next'; save(); render(); } break;

    // Personas
    case 'pSel': selPerson = selPerson===id ? null : id; ui.confirmDelP=null; render(); break;
    case 'askDelP': ui.confirmDelP = id; render(); break;
    case 'cancelDelP': ui.confirmDelP = null; render(); break;
    case 'delP': S.people = S.people.filter(p=>p.id!==id); S.items.forEach(x=>{ if (x.personId===id) x.personId=null; }); selPerson=null; ui.confirmDelP=null; save(); render(); break;

    // Cierre
    case 'star': if (i){
      const n = S.items.filter(x=>x.tomorrow && x.status!=='done').length;
      if (!i.tomorrow && n>=3){ toast('Ya elegiste 3. Quita una estrella para cambiarla.'); break; }
      i.tomorrow = !i.tomorrow; save(); render(); } break;
    case 'closeDay': S.closedOn = today(); save(); celebrate(b); toast('Día cerrado. Lo que queda está guardado, no en tu cabeza.'); render(); break;

    // Archivo
    case 'pRef': {
      const it = item(proc.id); if (!it) break;
      const now = Date.now();
      S.notes.push({id:uid(), type:'note', title:((proc.action||'').trim()||it.text).slice(0,120), body:it.text, personId:proc.personId==='me'?null:proc.personId, tags:[], createdAt:now, updatedAt:now});
      S.items = S.items.filter(x => x.id!==it.id); proc = null; save(); toast('Guardado en Archivo.'); render(); break;
    }
    case 'arNew': arEdit = {type:b.dataset.type}; render(); setTimeout(()=>{ const t=$('#arTitle'); t&&t.focus(); },0); break;
    case 'arEdit': arEdit = {id}; view!=='archivo' ? go('archivo') : render(); window.scrollTo({top:0}); setTimeout(()=>{ const t=$('#arTitle'); t&&t.focus(); },0); break;
    case 'arCancel': arEdit = null; render(); break;
    case 'arPin': { const n = S.notes.find(x=>x.id===id); if (n){ n.pinned = !n.pinned; save(); render(); } break; }
    case 'arAskDel': arConfirmDel = id; render(); break;
    case 'arDelNo': arConfirmDel = null; render(); break;
    case 'arDel': S.notes = S.notes.filter(x=>x.id!==id); arConfirmDel = null; if (arEdit && arEdit.id===id) arEdit = null; save(); toast('Borrado del Archivo.'); render(); break;
    case 'arFilter': { const v = b.dataset.v; arFilter = arFilter===v ? 'all' : v; if (view!=='archivo') go('archivo'); else render(); break; }
    case 'arOpen': arOpen[id] = !arOpen[id]; render(); break;
    case 'copy': {
      const v = b.dataset.v;
      const ok = () => toast('Copiado: ' + v);
      const fail = () => { const r = document.createRange(); const el = b.parentElement.querySelector('.v'); if (el){ r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('Seleccionado. Usa Ctrl+C para copiar.'); };
      try { navigator.clipboard.writeText(v).then(ok, fail); } catch(e){ fail(); }
      break;
    }
    // Seguridad
    case 'exportCopy': exportCopy(); break;
    case 'retrySave': save(); break;
    case 'askRestore': ui.confirmRestore = true; render(); break;
    case 'cancelRestore': ui.confirmRestore = false; render(); break;
    case 'doRestore': restore(); break;
    case 'askWipe': ui.confirmWipe = true; render(); break;
    case 'cancelWipe': ui.confirmWipe = false; render(); break;
    case 'wipe': S.items = []; S.timer = null; save(); go('ahora'); toast('Pendientes borrados. Tus contactos y notas siguen ahí.'); break;
  }
});

/* ---------- Cifrado ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = u8 => { let s=''; const a=new Uint8Array(u8); for (let k=0;k<a.length;k+=0x8000) s += String.fromCharCode.apply(null, a.subarray(k,k+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter||ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptWith(key, salt, data){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(data)));
  return JSON.stringify({app:'foco-diario', v:2, kdf:'PBKDF2-SHA256', iter:ITER, alg:'AES-GCM-256', salt:b64(salt), iv:b64(iv), data:b64(ct), savedAt:new Date().toISOString()});
}
async function decryptText(txt, pw){
  const o = JSON.parse(txt);
  if (o.app !== 'foco-diario') throw new Error('format');
  const salt = unb64(o.salt);
  const key = await keyFrom(pw, salt, o.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.data));
  return {data:JSON.parse(dec.decode(pt)), key, salt, iterOk: (o.iter||ITER)===ITER};
}

async function exportCopy(){
  const msg = m => { ui.bkMsg = m; render(); };
  if (!window.showSaveFilePicker) return msg('<p class="err-line small">Este navegador no permite elegir dónde guardar. Copia el archivo datos.focodata de tu carpeta a la USB.</p>');
  try {
    const fh = await window.showSaveFilePicker({suggestedName:`foco-diario-copia-${today()}.focodata`, types:[{description:'Copia de Foco Diario', accept:{'application/octet-stream':['.focodata']}}]});
    S.settings.lastBackup = Date.now();
    const txt = await encryptWith(KEYC, SALT, S);
    const w = await fh.createWritable(); await w.write(txt); await w.close();
    save(); toast('Copia guardada.');
    msg(`<p class="ok-line small">Copia guardada como ${esc(fh.name)}.</p>`);
  } catch(e){
    if (e && e.name === 'AbortError') return;
    msg('<p class="err-line small">No se pudo guardar ahí. Prueba otra ubicación, por ejemplo tu USB o Escritorio.</p>');
  }
}
async function restore(){
  const out = m => { ui.rsMsg = m; ui.confirmRestore = false; render(); };
  const pw = $('#rsPw').value; const file = $('#rsFile').files[0];
  if (!file) return out('<p class="err-line small">Elige el archivo de la copia.</p>');
  if (!pw) return out('<p class="err-line small">Escribe la contraseña de esa copia.</p>');
  try {
    const r = await decryptText(await file.text(), pw);
    S = r.data; normalize(); S.timer = null; S.lastOpen = today();
    save(); ui = {}; ui.rsMsg = '<p class="ok-line small">Copia restaurada. Se guarda con tu contraseña actual.</p>'; render(); toast('Todo de vuelta.');
  } catch(err){
    out('<p class="err-line small">No se pudo abrir. Revisa que sea un archivo .focodata y que la contraseña sea la de esa copia.</p>');
  }
}
async function changePw(){
  const out = m => { ui.cpMsg = m; render(); };
  const o = $('#cpOld').value, n = $('#cpNew').value, n2 = $('#cpNew2').value;
  if (n.length < 8) return out('<p class="err-line small">La nueva contraseña necesita al menos 8 caracteres.</p>');

  try {
    if (saveT){ clearTimeout(saveT); saveT = null; }
    await flush();
    const fh = await dirH.getFileHandle(DATA);
    await decryptText(await (await fh.getFile()).text(), o);
  } catch(e){ return out('<p class="err-line small">La contraseña actual no es correcta.</p>'); }
  SALT = crypto.getRandomValues(new Uint8Array(16));
  KEYC = await keyFrom(n, SALT);
  bkDay = null;
  await flush();
  ui.cpMsg = '<p class="ok-line small">Contraseña cambiada.</p>'; render(); toast('Contraseña cambiada.');
}

/* ---------- Carpeta recordada (solo el acceso, nunca los datos) ---------- */
function idb(){ return new Promise((res,rej)=>{ const r = indexedDB.open('foco-diario',1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise(res => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result||null); q.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbSet(k,v){ try { const db = await idb(); db.transaction('h','readwrite').objectStore('h').put(v,k); } catch(e){} }

  } else if (mode==='unlock'){
    h = `<p class="muted">Carpeta: <b>${name}</b></p>
      <form id="lkForm" data-mode="unlock"><input class="field" type="password" id="lkPw" placeholder="Tu contraseña" autocomplete="current-password" aria-label="Contraseña">
      ${err}<button class="btn primary big" style="justify-content:center">Desbloquear</button></form>
      <p class="lk-note">Si Edge pregunta por la carpeta, elige <b>Permitir</b>.</p>
      <button class="btn ghost small" data-lk="pick">Usar otra carpeta</button>`;
  } else if (mode==='create'){
    h = `<p>Vamos a crear tu archivo de pendientes en <b>${name}</b>. Elige una contraseña: con ella se cifra todo.</p>
      <form id="lkForm" data-mode="create">
        <input class="field" type="password" id="lkPw" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password" aria-label="Contraseña nueva">
        <input class="field" type="password" id="lkPw2" placeholder="Repite la contraseña" autocomplete="new-password" aria-label="Repite la contraseña">
        <label class="toggle small"><input type="checkbox" id="lkAck"> Entiendo que si olvido la contraseña, nadie puede recuperar mis datos.</label>
        ${err}<button class="btn primary big" style="justify-content:center">Crear y empezar</button>
      </form>
      <button class="btn ghost small" data-lk="pick">Usar otra carpeta</button>`;
  }
  $('#lockBody').innerHTML = h;
  const pw = document.getElementById('lkPw'); if (pw) setTimeout(()=>pw.focus(), 30);
}
async function ensurePerm(){
  const o = {mode:'readwrite'};
  if ((await dirH.queryPermission(o)) === 'granted') return true;
  return (await dirH.requestPermission(o)) === 'granted';
}
async function pickFolder(){
  try {
    dirH = await window.showDirectoryPicker({id:'foco-diario', mode:'readwrite', startIn:'documents'});
  } catch(e){
    if (e && e.name==='AbortError') return;
    return showLock('pick', 'Windows no deja usar esa carpeta directamente. Crea una carpeta nueva dentro de Documentos (por ejemplo, Foco Diario) y elígela.');
  }
  await idbSet('dir', dirH);
  try { await dirH.getFileHandle(DATA); showLock('unlock'); } catch(e){ showLock('create'); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-lk]'); if (b && b.dataset.lk==='pick') pickFolder(); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'lkForm') return;
  e.preventDefault();
  const btn = e.target.querySelector('button'); const pw = $('#lkPw').value;
  if (e.target.dataset.mode === 'create'){
    if (pw.length < 8) return showLock('create', 'La contraseña necesita al menos 8 caracteres.');
    if (pw !== $('#lkPw2').value) return showLock('create', 'Las contraseñas no coinciden.');
    if (!$('#lkAck').checked) return showLock('create', 'Marca la casilla para confirmar que lo entiendes.');
    btn.disabled = true; btn.textContent = 'Creando…';
    try {
      if (!(await ensurePerm())) return showLock('create', 'Edge necesita permiso para guardar en la carpeta. Intenta de nuevo y elige Permitir.');
      SALT = crypto.getRandomValues(new Uint8Array(16));
      KEYC = await keyFrom(pw, SALT);
      startSession(examples(), true);
    } catch(err){ showLock('create', 'No se pudo crear el archivo. Elige otra carpeta.'); }
    return;
  }
  if (!pw) return showLock('unlock', 'Escribe tu contraseña.');
  btn.disabled = true; btn.textContent = 'Abriendo…';
  try {
    if (!(await ensurePerm())) return showLock('unlock', 'Edge necesita permiso para abrir la carpeta. Intenta de nuevo y elige Permitir.');
  } catch(err){ return showLock('pick', 'No encuentro la carpeta. ¿La moviste o renombraste? Elígela de nuevo.'); }
  let txt;
  try { txt = await (await (await dirH.getFileHandle(DATA)).getFile()).text(); }
  catch(err){ return showLock('create', 'Esta carpeta no tiene datos todavía. Crea tu archivo.'); }
  try {
    const r = await decryptText(txt, pw);
    KEYC = r.key; SALT = r.salt;
    startSession(r.data, !r.iterOk);
  } catch(err){ showLock('unlock', 'Contraseña incorrecta. Intenta de nuevo.'); }
});

let lastAct = Date.now();
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => lastAct = Date.now(), true));
function startSession(data, forceSave){
  S = data; normalize();
  const changed = morning();
  $('#lock').hidden = true; $('#app').hidden = false; $('#lockBody').innerHTML = '';
  lastAct = Date.now();
  capHint();
  const h = location.hash.slice(1);
  go(VIEWS[h] ? h : 'ahora');
  if (forceSave || changed) { flush(); } else { setSave('ok'); }
}
async function lockNow(){
  if (!S) return;
  if (saveT){ clearTimeout(saveT); saveT = null; flush(); }
  await writing;
  S = null; KEYC = null; SALT = null; proc = null; ui = {};
  $('#main').innerHTML = ''; $('#capIn').value = '';
  showLock('unlock');
}
setInterval(() => {
  const m = S && S.settings.autoLock;
  if (S && m && Date.now()-lastAct > m*60000) lockNow();
}, 15000);

/* ---------- Inicio ---------- */
window.addEventListener('hashchange', () => { if (!S) return; const h = location.hash.slice(1); if (h && h!==view && VIEWS[h]) go(h); });
(async () => {
  if (!window.showDirectoryPicker || !window.crypto || !crypto.subtle) return showLock('unsupported');
  dirH = await idbGet('dir');
  showLock(dirH ? 'unlock' : 'pick');
})();
})();
</script>
